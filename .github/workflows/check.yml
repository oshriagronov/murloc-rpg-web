# Runs on every push and pull request: the type check, the engine's unit tests and the
# smoke test (a new game and every scene in headless Chrome). See AGENTS.md, "Commands".
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The runner comes with Google Chrome, which is what the smoke test drives.
      - run: npm run smoke
