<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Murloc RPG: Stranglethorn Fever</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, sans-serif; color: #e8e6e3; }
      /* On a touch screen: no page zoom, pull-to-refresh, text selection or long-press menu over the game. */
      body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; overflow: hidden; }
      #stage canvas { width: 100%; height: 100%; touch-action: none; }
      #overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0d10; }
      #start { font: inherit; font-size: 22px; padding: 12px 36px; border: 2px solid #c9a227; border-radius: 6px; background: #1d2026; color: #f3d77a; cursor: pointer; }
      #start:hover:enabled { background: #2a2e36; }
      #start:disabled { opacity: 0.7; cursor: default; }
      #loading { width: min(320px, 70%); text-align: center; font-size: 15px; color: #c9c5bd; }
      #bar { height: 10px; margin-bottom: 10px; border: 1px solid #c9a227; border-radius: 6px; overflow: hidden; background: #1d2026; }
      #fill { width: 0; height: 100%; background: #c9a227; transition: width 0.15s linear; }
      #notice { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 3; max-width: 90%; padding: 8px 14px; border: 1px solid #a33; border-radius: 6px; background: rgba(40, 14, 14, 0.92); color: #f2d9d9; font-size: 14px; text-align: center; }
      #fullscreen { position: fixed; right: 8px; bottom: 8px; width: 34px; height: 34px; border: 1px solid #444; border-radius: 6px; background: rgba(20, 22, 26, 0.7); color: #bbb; font-size: 18px; cursor: pointer; }
      #fullscreen:hover { color: #fff; border-color: #888; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="overlay">
        <button id="start">Play</button>
        <div id="loading" hidden><div id="bar"><div id="fill"></div></div><div id="status">Loading…</div></div>
      </div>
    </div>
    <div id="notice" role="status" hidden>Part of the game could not be loaded. Check your connection; trying again…</div>
    <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
